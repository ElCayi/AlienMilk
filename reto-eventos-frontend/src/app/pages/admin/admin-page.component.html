<app-panel-frame area="Administración" navLabel="Secciones del panel de control" [items]="navItems()">
  <!-- La visión general lleva el saludo y el resumen; las demás secciones empiezan ya con lo suyo, en su
       hoja, con el rótulo encima del título: nada que bajar cada vez que se cambia de sección. -->
  <section
    [class.page-content]="current().path !== 'resumen'"
    [class.is-titled]="current().path !== 'resumen'"
    [attr.aria-label]="current().label"
  >
    @if (current().path !== 'resumen') {
      <p class="page-kicker section-kicker">
        <span class="eyebrow-icon" aria-hidden="true"></span>Panel de control · {{ current().label }}
      </p>
    }
    <router-outlet />
  </section>

  <app-panel-confirm />
</app-panel-frame>
