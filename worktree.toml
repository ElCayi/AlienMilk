# What every copy of this project needs to run side by side.
# Full reference: wt project --help

[ports]
# Offsets from a base port allocated once per worktree. The base is derived from
# the worktree name and recorded in .env.worktree, so a worktree keeps the same
# URL for its whole life and it can be bookmarked.
FRONTEND_PORT = 0
BACKEND_PORT = 1
DB_PORT = 2

[services]
supervisor = "script"
# The main worktree hosts the database. Applications remain isolated per
# worktree. This is the only place where that split is declared.
commons = ["mariadb"]
