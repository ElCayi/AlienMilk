<app-panel-frame area="Mi panel" navLabel="Secciones de Mi panel" [items]="navItems()">
  <header class="page-head">
    <div>
      <p class="page-kicker">Área personal · {{ section() }}</p>
      <h1>Hola, {{ name() }}</h1>
      <p class="page-intro">Tus sesiones reservadas, tus pedidos de la tienda y tu cuenta.</p>
    </div>

    <ul class="panel-shortcuts" aria-label="Accesos rápidos">
      <li>
        <a routerLink="/sesiones">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 3v4M16 3v4M4 10h16M12 13v4M10 15h4" />
          </svg>
          <span>Reservar una sesión</span>
          <svg class="out-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg><span class="visually-hidden">, en la web pública</span>
        </a>
      </li>
      <li>
        <a routerLink="/tienda">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5zM3 7.5 12 12l9-4.5M12 12v9" />
          </svg>
          <span>Ir a la tienda</span>
          <svg class="out-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg><span class="visually-hidden">, en la web pública</span>
        </a>
      </li>
    </ul>
  </header>

  <section class="page-content" [attr.aria-label]="section()">
    <router-outlet />
  </section>

  <app-panel-confirm />
</app-panel-frame>
