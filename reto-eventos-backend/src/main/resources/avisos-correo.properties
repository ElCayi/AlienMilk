# Valores por defecto del aviso por correo (AvisosCorreoConfig). Nada secreto: la cuenta, la
# contraseña y el destino llegan por variables de entorno (ver .env.local.example), que mandan
# sobre este archivo. Sin SPRING_MAIL_HOST y AVISOS_CORREO_DESTINO el aviso queda apagado.
spring.mail.port=587
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sin tiempos de espera, un servidor que no responde deja el hilo colgado para siempre.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

avisos.correo.remitente=${spring.mail.username:}
