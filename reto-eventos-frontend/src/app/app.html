<div class="app-shell">
  <header class="topbar" [class.menu-open]="menuOpen()">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-logo" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">AlienMilk</span>
        <span class="brand-subtitle">Sessions</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-label="Abrir o cerrar el menú de navegación"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="main-navigation">
      <a href="/#inicio" (click)="goToSection($event, 'inicio')">Inicio</a>
      <a routerLink="/sesiones" (click)="closeMenu()">Sesiones</a>
      <a routerLink="/nosotros" (click)="closeMenu()">Nosotros</a>
      <a
        routerLink="/tienda"
        [attr.aria-label]="cart.units() ? 'Tienda, ' + cart.units() + ' en su pedido' : null"
        (click)="closeMenu()"
        >Tienda@if (cart.units(); as units) {<span class="nav-count" aria-hidden="true">{{ units }}</span>}</a
      >
      <a routerLink="/contacto" (click)="closeMenu()">Contacto</a>
    </nav>

    <div class="auth-box" *ngIf="authService.currentUser(); else guestBlock">
      <span class="user-pill">
        {{ authService.currentUser()?.nombre }} · {{ authService.currentUser()?.perfil === 'ROLE_ADMON' ? 'Admin' : 'Cliente' }}
      </span>
      <a class="ghost-btn auth-action" *ngIf="!authService.isAdmin()" routerLink="/reservas" (click)="closeMenu()">Mi panel</a>
      <a class="ghost-btn auth-action" *ngIf="authService.isAdmin()" routerLink="/admin" (click)="closeMenu()">Admin</a>
      <button type="button" class="secondary-btn auth-action" (click)="logout()">Salir</button>
    </div>

    <ng-template #guestBlock>
      <div class="guest-actions">
        <a class="ghost-btn" routerLink="/login" (click)="closeMenu()">Entrar</a>
        <a class="dark-btn" routerLink="/registro" (click)="closeMenu()">Registrarse</a>
      </div>
    </ng-template>
  </header>

  <main class="page-container">
    <router-outlet />
  </main>

  <app-site-footer *ngIf="shouldShowFooter()" />
</div>
